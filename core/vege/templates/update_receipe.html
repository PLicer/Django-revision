<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .receipe-img { width: 90px; height: 90px; object-fit: cover; border-radius: 8px; }
        .table td, .table th { vertical-align: middle; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-success mb-4">
  <div class="container">
    <span class="navbar-brand fw-semibold">🥗 Receipe Book</span>
  </div>
</nav>

<div class="container pb-5">
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-body p-4">
      <h4 class="card-title mb-3">Update Receipe</h4>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
          <label for="receipe_name" class="form-label">Receipe name</label>
          <input id="receipe_name" name="receipe_name" value = "{{receipe.receipe_name}}" required type="text" class="form-control" placeholder="e.g. Paneer Butter Masala">
        </div>
        <div class="mb-3">
          <label for="receipe_description" class="form-label">Receipe Desc</label>
          <textarea id="receipe_description" name="receipe_description" required rows="3" class="form-control" placeholder="How do you make it?">{{receipe.receipe_description}}</textarea>
        </div>
        <div class="mb-3">
          <label for="receipe_image" class="form-label">Receipe Image</label>
          <input id="receipe_image" name="receipe_image" type="file" accept="image/*" class="form-control">
        </div>
        <button type="submit" class="btn btn-success px-4">Submit</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
